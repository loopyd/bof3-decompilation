# capcom97-bof3 profile — Capcom BOF3 PSX compiler settings
#
# Paths are resolved relative to the repository root (REBOF3_ROOT_DIR)
# unless they start with / or are found in PATH.

[psyq]
version = "4.7"

[cc]
path = "toolchains/gcc-2.7.2-psx/gcc"
flags = ["-O2", "-G0", "-funsigned-char", "-msoft-float", "-gcoff"]

[maspsx]
aspsx_version = "2.56"
script = "third_party/maspsx/maspsx.py"

[as]
name = "mipsel-none-elf-as"
toolchain_bin = "toolchains/psn00b_toolchain/bin"
flags = ["-G0", "-EL", "-mips1"]
