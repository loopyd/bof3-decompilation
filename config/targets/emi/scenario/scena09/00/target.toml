# twelve values through the twelve-word table the overlay keeps at 0x801F6C04
# in its leading table data, and the phase switch of its world 0x37 arm
# dispatches eleven values through the eleven-word table at 0x801F6C34; psyq
# gcc emits the switch tables of one translation unit as one .rodata section,
# so this row gives the comparator the payload address and size of that
