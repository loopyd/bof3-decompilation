      0x80146865..0x80146867 and the secondary and primary state bytes; state 5
      tests flag 0x27 and then flag 0x25 and, when either is set, queues action
      0x0A or 8, latches the phase byte to 2 and arms secondary state 1, while
      with both flags clear it queues action 9 and advances to secondary state
      6; state 6, unless the phase byte reads 2, moves to secondary state 7 at
      progress 1 and otherwise releases the overlay and clears the progress byte
      and the shared bytes; state 7 runs the shared GAME.EMI helper
      func_801BE1B0 with mode 0 and advances to secondary state 8; state 8
      advances to secondary state 9 at progress 2; state 9, at progress 3, sets
      flag bit 0x25 of D_8014686C through func_8015B580, releases the overlay
      and clears the shared bytes. The 0x18-byte frame keeps $ra and $s0 across
      the calls, the state-byte load and its bound test are hoisted above the
      frame setup, and the ten-word case table sits in the overlay rodata slot
      at 0x801F7044.'
