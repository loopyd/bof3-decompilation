# The sub-state switch of the entry-4 progress handler at 0x801FB8A0 dispatches
# eleven values through the eleven-word table the overlay keeps at 0x801F6C8C in
# its leading table data; psyq gcc emits a switch table as .rodata, so this row
# gives the comparator the payload address and size of that table.
[[matching.section_placements]]
function = 0x801FB8A0
section = ".rodata"
address = 0x801F6C8C
size = 0x2C

# The eight-value sub-state switch of the handler at 0x801FD1A4 dispatches
# through the eight-word table the overlay keeps at 0x801F6D94 in the same
# leading table data; this row gives the comparator that table's payload
# address and size.
[[matching.section_placements]]
function = 0x801FD1A4
section = ".rodata"
address = 0x801F6D94
size = 0x20


# The sixteen-value sub-state switch of the entry-7 progress handler at
# 0x801FC21C dispatches through the sixteen-word table the overlay keeps at
# 0x801F6CE4 in the same leading table data; this row gives the comparator that
# table's payload address and size.
[[matching.section_placements]]
function = 0x801FC21C
section = ".rodata"
address = 0x801F6CE4
size = 0x40
