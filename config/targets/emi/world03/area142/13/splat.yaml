    - '@behavior: Overlay step dispatch. The leading two instructions read the work record pointer from the scratchpad cell 0x1F800044 before the 0x18-byte frame is reserved, then load record byte 4 unsigned, scale it by four and index the local handler table at 0x801F3B7C. The selected entry is called through jalr v0 with a nop delay slot, after which the body reloads ra from 0x10(sp), releases the frame and returns. Takes no arguments and returns nothing; the frame keeps the return address across the call. The table holds 0x801F3458 and 0x801F34D0, the two routines that set and clear that same record byte 4 from the shared mode byte at 0x80143BB0, so byte 4 selects which of the two runs, and the word at 0x801F3B34 publishes this dispatcher itself.'
