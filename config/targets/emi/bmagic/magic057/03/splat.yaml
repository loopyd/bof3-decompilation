    - dispatchWorkByte1HandlerBmagicMagic05703_801EF02C
    - '@source: src/bof3/bmagic/dispatchWorkByte1HandlerBmagicMagic05703_801EF02C.c'
    - '@behavior: Dispatches one frame of the overlay work handler from the scratchpad work object: the work-object pointer cell at 0x1F800044 is read, its state byte at offset 1 selects an entry of the three-entry code pointer table at 0x801EEC20 (0x801EF08C, 0x801EF55C, 0x801EF83C), and that entry is invoked with no arguments. The three table words are copied into the dispatcher own 0x28-byte frame first, so the call target is read back from the copy; the index is not bounds-checked. It reads no other state and writes none.'
