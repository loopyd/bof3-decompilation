    - '@behavior: First phase handler of the scratchpad overlay work object published through the pointer cell at 0x1F800044. The dispatcher at 0x801EF620 materialises the addresses of this function and the handler at 0x801EF7E0 into a two-word local table and indexes it with the work object unsigned byte 0x03, so byte 0x03 holds zero while this body runs. This body loads the pointer cell once, reads the signed word at object offset 0x10 and, while that word is at least -2, stores the word minus one back at word width. When the word is below -2 the word is left alone and work byte 0x03 is incremented by one at byte width, which hands the next frame to the second table entry; that handler ramps the same word in the opposite direction and takes byte 0x03 back below zero, so the pair oscillates the word between -3 and zero. Byte 0x03 selects only this two-entry table and the word at 0x10 stays offset-anchored. No jal or table word in this payload names the span. Leaf with no frame: it takes no arguments, makes no call and returns nothing.'
