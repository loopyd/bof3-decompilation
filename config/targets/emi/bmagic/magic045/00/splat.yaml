    - '@behavior: Work-step handler, entry 5 of the eight-entry handler table at 0x801EF8E0. It calls the no-argument main-executable update func_8014D978 and discards the result, then selects the 0x78-byte action-slot store record with the scratchpad work-object byte at offset 0xB and copies its words +0x34 and +0x38 into work words +0x34 and +0x38 through one value local. It passes the work word +0x34 re-read through the pointer and that value local to the distance helper func_8015477C and stores the returned signed halfword at work +0x3E. When the record signed halfword +0x3E is smaller than that distance it copies record word +0x3C into work word +0x3C, and when record byte +0x02 equals 2 it advances the work state byte +0x02 by one. The index byte is re-read from the loaded pointer before each scaled access group and the pointer cell is re-read for all three groups, so three lui/lw base pairs appear; the 0x18-byte frame only keeps $ra across the two calls.'
