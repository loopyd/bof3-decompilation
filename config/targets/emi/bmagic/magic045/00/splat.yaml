    - '@behavior: Step wrapper around one overlay work handler: publishes 0x800C3800 into the global at 0x801459F0, reads the work object published at the scratchpad pointer cell 0x1F800044, scales that object byte 2 by four and invokes the selected entry of the eight-entry handler table based at 0x801EF8E0 (0x801EEF80, 0x801EF118, 0x801EF2B0, 0x801EF3D8, 0x801EF4A4, 0x801EF608, 0x801EF724, 0x801EF8A4) with no arguments. After the handler returns it re-reads the pointer cell and, when the work object byte 0 and byte 2 are both non-zero, runs the shared main-executable service func_8014D290. It then publishes 0x800D3800 into 0x801459F0. Each literal reaches the cell through its own lui/ori pair and a lui %hi / sw %lo store; the 0x18-byte frame only keeps $ra across the two calls.'
