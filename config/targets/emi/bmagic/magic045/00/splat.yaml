    - '@behavior: Overlay entry seed: copies the shared battle work record words at 0x34 and 0x38 and its halfword at 0x3E read through 0x801EB4E0 into the scratchpad work object published at the pointer cell 0x1F800044, seeds that object byte 0x24 = 4, byte 0x25 = 0x1D, byte 0x26 = 0, byte 0x27 = 0xA0, byte 0x28 = 0, byte 0x29 = 4, byte 0x2A = 0, byte 0x2B = 0, halfword 0x2C = 0, the 16.16 motion pair at 0x40/0x44 = 0x10000, byte 0x48 = 1, mode byte 0x5C = 2, the signed tint triplet 0x5D-0x5F = -0x40 and bit 0x20 of byte 0, requests resource 0 through func_8014D6B8, clears work byte 9 and advances work byte 2 by one. The cell is re-read before each store group because a store through the loaded pointer may alias the cell; the 0x3E halfword store and the 0x2C/0x2B pair share a load with their neighbors.'
