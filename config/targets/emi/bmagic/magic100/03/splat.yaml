    - '@behavior: Pushes the GTE matrix stack and reads the scratchpad work-record pointer cell at 0x1F800044 once before any call. Zeroes a translation halfword triplet in ascending element order, then builds a rotation triplet whose first two elements are work record words 0x34 and 0x38 shifted right by nine and biased by minus 0x4000, and whose third element is half the negated sum of the record signed halfword 0x3E and 0x100. RotTrans projects that triplet into the translation field of a 0x20-byte scratch matrix and writes a flag word after it, RotMatrix turns the zeroed triplet into that same matrix rotation, MulMatrix2 composes the shared matrix at 0x801492E8 with it, and the result is installed through SetRotMatrix and SetTransMatrix. Takes no arguments and returns nothing; the single in-payload call at 0x801EEEFC pairs the transform with PopMatrix.'
