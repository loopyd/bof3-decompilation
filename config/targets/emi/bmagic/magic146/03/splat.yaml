    - drawTranslucentTexturedQuadAtWorkHalfwords2EAnd30ScaledByWorkByte9TintedByWorkByteATimes8BmagicMagic14603_801EF604
    - '@source: src/bof3/bmagic/drawTranslucentTexturedQuadAtWorkHalfwords2EAnd30ScaledByWorkByte9TintedByWorkByteATimes8BmagicMagic14603_801EF604.c'
    - '@behavior: Per-frame quad emitter of this overlay work-byte-2 draw step. It reads the shared graphic type twice and selects the draw-mode texture page 0x125 when either answer is 1 or 2, else 0x55, then links a 0xC-byte draw-mode packet through SetDrawMode at g_PrimCursor with dfe 0 and dtd 1 anchored at the work object projection words 0x34 and 0x38 with kind 2. It publishes work byte 9 shifted left 1 into the signed halfword at 0x1F800000 and work byte 0xA shifted left 3 into the halfword at 0x1F800004, then takes a fresh g_PrimCursor POLY_FT4, seeds it through SetPolyFT4, marks it semi-transparent and writes four corners around the work object screen halfwords 0x2E and 0x30 from the 0x801783C8 and 0x801782FC samples of the 0x200, 0x600, 0xE00 and 0xA00 eighth-turn angles scaled by the published radius. The texture is tpage GetTPage(0, 2, 0x340, 0x100) and clut GetClut(0x20, 0x1FA) over the 0x20-by-0x20 uv window at (0x80, 0x20), and red, green and blue each read the scratchpad halfword 0x1F800004 back and truncate it, so all three channels carry eight times work byte 0xA. It then links the 0x28-byte polygon at the same projection words with kind 2. The 0x28-byte frame holds $ra at 0x20 plus the fifth draw-mode argument at 0x10; it takes no arguments and returns nothing.'
