    - incrementWorkByte9AndDecrementWorkByteAThenDecrementGlobalWorkByteBAndClearWorkBytesWhenZeroBmagicMagic14603_801EF58C
    - '@source: src/bof3/bmagic/incrementWorkByte9AndDecrementWorkByteAThenDecrementGlobalWorkByteBAndClearWorkBytesWhenZeroBmagicMagic14603_801EF58C.c'
    - '@behavior: Per-frame handler of the battle work object published at the scratchpad pointer cell 0x1F800044. It increments that object unsigned byte 0x09 by one at byte width and does not test the sum, re-reads the cell and subtracts one from unsigned byte 0x0A the same way, then tests the stored byte truncated to eight bits, so the truncated register rather than a reload supplies the compared value. Only when byte 0x0A reaches zero does it read the shared battle work record pointer at 0x801EB4E0, decrement that record byte 0x0B by one at byte width and call this overlay work-byte clear routine at 0x801EF964 with the store in the call delay slot. The 0x18-byte frame only keeps $ra at 0x10 across the call; takes no arguments, returns nothing and reads or writes no other state.'
