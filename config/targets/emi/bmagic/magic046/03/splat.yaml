    - '@behavior: Translucent textured-quad draw pass of the second stage of this overlay draw state machine, reached only from the two stage handlers at 0x801EF540 and 0x801EF660 after each of them advanced the work record projection words 0x34 and 0x38. It selects the draw-mode texture page argument 0xA5 when the shared graphic type is 1 or 2 and 0x35 otherwise, installs it at g_PrimCursor with dfe 0 and dtd 1 and links a 0xC-byte draw-mode packet at those work words with kind 2. It then seeds four scratchpad cells: the signed halfword at 0x1F800000 takes six times work byte 0x9 plus one while that byte is below eight and twice the byte plus 0x20 otherwise, the halfword at 0x1F800008 takes twenty times work byte 0xA as the flat tint, the halfword at 0x1F800004 takes work record halfword 0x2E and the one at 0x1F800006 takes 0x30. It emits one semi-transparent POLY_GT4 seeded through the shared seeder at 0x8017A9E0 whose four corners lie on the circle of that radius around the screen pair at phases 0xC00, 0x800, 0 and 0x400 in vertex order, each corner x the 0x801782FC sample of its phase scaled by the radius and shifted right twelve and each corner y the 0x801783C8 sample scaled the same way, with uv pairs 1,1 and 0x1F,1 and 1,0x1F and 0x1F,0x1F, texture page GetTPage(0, 1, 0x340, 0x100), clut GetClut(0, 0x1FA) and all twelve colour bytes stored from their own read of the tint halfword. Finally it links the finished 0x34-byte polygon at the same work words with kind 2. Takes no arguments and returns nothing; the 0x28-byte frame keeps ra at 0x20, the primitive pointer at 0x1C, the tint base at 0x18 and the fifth draw-mode argument at 0x10, and the scratchpad cells and the work record offsets stay address-anchored.'
