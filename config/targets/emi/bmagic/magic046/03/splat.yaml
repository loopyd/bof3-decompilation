    - '@source: src/bof3/bmagic/reserveFirstFreeRecordBmagicMagic04603_801EFED0.c'
    - '@behavior: Reserves the first of 48 records in the pool at 0x801EFF3C whose flags byte has bit 0 clear, sets that bit and returns its index. Records have stride 0x78. The original re-materializes the pool address for the flags load and again for the store, and returns 0xFF once all 48 records are occupied. The caller at 0x801EF090 masks the result to a byte and indexes the same pool with it to fill record word 0x74 and bytes 0xA and 0xB, the sweep at 0x801EEC60 treats that same bit 0 as the in-use flag and the reset at 0x801EED50 clears bytes 0 through 2 of every record, so a zero-extended byte result is what they consume. Takes no arguments.'
