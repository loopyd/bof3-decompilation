    - '@source: src/bof3/bmagic/stateCounterCountdownAdvance3.c'
    - '@behavior: Handler at entry 2, zero-based, of the code-pointer run at 0x801EEC04: the word at 0x801EEC0C holds this address, ahead of which the run reads 0x801EED38 and 0x801EEFA4. This overlay''s work-byte-1 dispatcher func_801EEC28 copies the six words of that run into its own frame, scales the work object''s unsigned byte 1 by four and calls the word it selects. The body reads the scratchpad work-object pointer cell at 0x1F800044 once per counter group and, for each of the record''s three counter bytes, re-reads the work object''s unsigned byte 0xA, scales it by the 12-byte record stride into a byte offset and increments the selected record''s bytes 0x0, 0x1 and 0x2 with a byte-width read-modify-write. It then re-reads the cell, loads the work object''s unsigned byte 9 and decrements it in place, testing the stored value truncated to eight bits, so the tail group runs only when that countdown reaches zero; on zero it re-reads the cell and increments the work object''s byte 1 at byte width, advancing the stage index the dispatcher selects to the next entry of the same run. It keeps a 0x10-byte frame whose bytes it never touches, takes no arguments, returns nothing and writes no other state.'
