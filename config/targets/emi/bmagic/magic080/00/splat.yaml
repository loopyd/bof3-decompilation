    - '@source: src/bof3/bmagic/decayWorkHalfword2EThenDrawByWorkByteBAndRaiseFlag4WhenByte9ExpiresBmagicMagic08000_801EECE4.c'
    - '@behavior: Work byte 1 state 1 of the MAGIC080 overlay: entry 1 of the two-entry handler table func_801EEC04 builds in its own frame and dispatches on the scratchpad work object state byte 1, which state 0 at 0x801EEC5C advances into. It calls the shared update pass func_800AF764, re-reads the work-object pointer cell 0x1F800044 and subtracts 0x24 from the unsigned work halfword 0x2E, that store filling the branch delay slot. It then calls the seven-tile row variant drawSevenTileTexturedRowAtWorkHalfwords2EAnd30FromTileTableBmagicMagic08000_801EEF5C when the work object byte 0x0B is non-zero and the six-tile row variant drawSixTileTexturedRowAtWorkHalfwords2EAnd30FromTileTableBmagicMagic08000_801EED94 when it is zero. After that group it re-reads the cell and decrements work byte 0x09 at byte width, the stored value truncated to eight bits supplying the test, so the countdown reaching zero loads the shared battle byte at 0x80146384 unsigned and passes it to func_800A9820, raises bit 0x4 of the shared battle halfword at 0x801462E8 and invokes func_801E5988. The 0x18-byte frame only keeps $ra across the calls; it returns nothing.'
  - - 404
