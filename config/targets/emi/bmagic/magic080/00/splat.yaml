    - drawSixTileTexturedRowAtWorkHalfwords2EAnd30FromTileTableBmagicMagic08000_801EED94
    - '@source: src/bof3/bmagic/drawSixTileTexturedRowAtWorkHalfwords2EAnd30FromTileTableBmagicMagic08000_801EED94.c'
    - '@behavior: Textured row variant of the MAGIC080 overlay: the draw entry the work byte 1 state 1 handler func_801EECE4 selects when the random frame-mask byte 0x0B is zero, where the same handler selects drawSevenTileTexturedRowAtWorkHalfwords2EAnd30FromTileTableBmagicMagic08000_801EEF5C for a non-zero mask. It emits six 0x28-byte POLY_FT4 primitives from the cursor cell 0x8014598C, each stamped by SetPolyFT4, and every primitive is a 12x12 texel cell: x0 and x2 take the work halfword 0x2E plus the counter times 0xC and x1 and x3 take that halfword plus the counter plus one times 0xC, so the six cells tile a 0x48-unit horizontal row, while y0 and y1 take the work halfword 0x30 and y2 and y3 take it plus 0xC. The row uses 0x80 in all three colour channels, the texture page GetTPage(0, 1, 0x3C0, 0x100) and the clut GetClut(0, 0x1E0), its four uv corners come from the overlay tile table 0x801EF124 indexed by the counter (u0, u1 and u2 read the entry first halfword and u3 that halfword plus 0xC; v0, v1 and v2 read the entry second halfword and v3 that halfword plus 0xC), and each primitive is queued with GpuAppendPrim(2, 0x28). It takes no argument, returns nothing, and the 0x28-byte frame only keeps $ra plus $s0-$s3 across the five calls per iteration.'
