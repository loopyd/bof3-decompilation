    - '@behavior: Work byte 1 state 0 of the MAGIC080 overlay: entry 0 of the two-entry handler table func_801EEC04 builds in its own frame (0x801EEC5C, 0x801EECE4) and dispatches on the scratchpad work object''s state byte 1. It seeds the work object published at the pointer cell 0x1F800044: work word 0x34 takes the shared channel word at 0x80149308, work word 0x38 takes 0x8014930C through one value local that is also the helper''s second argument, and work halfword 0x3E takes the signed func_8015477C distance of that pair. It then seeds work byte 0xB with the low six bits of rand(), sets the countdown byte 9 to 0x30 and advances work byte 1 with a byte-width read-modify-write, which selects entry 1 (0x801EECE4). The 0x18-byte frame only keeps $ra across the two calls; it reads or writes no other state and returns nothing.'
