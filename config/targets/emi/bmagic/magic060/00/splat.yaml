    - '@behavior: Draws the result panel of the current battle target. It reads the selector byte 0x80146384, saves the party byte of that selector''s 0x140-byte work record at 0x80145F09 (row offset 0x79), stores zero over it, passes the same row''s name string 0x80145F04 (row offset 0x74) with pen position (0x70,0x30) to the overlay text helper func_801EF590, then re-reads the selector and restores the party byte, so it is only cleared for the name draw. It then draws ten static label strings of this overlay with the same two helpers: func_801EF76C draws WEAK at (0x5A,0x44), POINT at (0x80,0x44) and ITEM at (0x5A,0x8A), and func_801EF590 draws the twelve-glyph 0x5C rule at (0x70,0x50), (0x70,0x98) and (0x70,0xAC), the one-glyph 0x5C cell 0x801F0B88 at (0x9C,0x64) and (0x9C,0x78), EXP at (0xB0,0x64) and the one-glyph 0x60 cell 0x801F0B70 at (0xB0,0x78). Frame 0x20 holding s0 and s1; takes no arguments and returns nothing.'
