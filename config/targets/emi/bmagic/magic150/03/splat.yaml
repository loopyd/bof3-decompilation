    - callWorkByte1Handlers
    - '@source: src/bof3/bmagic/callWorkByte1Handlers.c'
    - '@behavior: Overlay entry dispatcher for this magic work handler. The scratchpad work-object pointer cell at 0x1F800044 is read first, ahead of the frame adjustment, and its state byte at offset 1 is read after the table copy as the step index. The seven code pointer words of the overlay handler table at 0x801EEC04 (0x801EECA4, 0x801EED60, 0x801EEDCC, 0x801EEE24, 0x801EEEC4, 0x801EEF80, 0x801EF00C) are copied into its own 0x38-byte frame at $sp+0x10, the word the state byte selects is read back from that copy, and it is invoked with no arguments; the index is not bounds-checked. The epilogue restores $ra from $sp+0x30 and $sp from +0x38 and leaves the handler answer in $v0, so this entry returns whatever the selected handler returns. It writes no cell, has no loop, and no word of this payload holds this entry address, so it is reached from outside the payload and its prologue and return path alone place the boundary.'
  - - 164
