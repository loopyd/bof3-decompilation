    - '@behavior: Magic-150 effect handler, the entry at 0x801EEC1C of the overlay handler table 0x801EEC04 and index 6 of its seven words, which the dispatcher 0x801EEC20 copies into its 0x38-byte frame and indexes by unsigned work byte 1. It raises bit 0x4 of the shared battle global halfword at 0x801462E8 with a halfword read-modify-write: the address is materialized once, the halfword is loaded unsigned into $v0, ori sets 0x4 and the halfword store fills the call delay slot while that address register stays live. It then calls the main-executable helper 0x801E5988 with no arguments and returns nothing; it neither advances work byte 1 nor touches work byte 9, so it runs once per dispatching frame and leaves the handler index where it was. Its 52 bytes are identical to the exact sibling 0x801EFCFC of emi/bmagic/magic008/00, and the only reference to this address in the payload is its word in the handler table.'
