    - '@source: src/bof3/bmagic/renderRedSideNegative.c'
    - '@behavior: The overlay ring pass of the draw setup 0x801EF254. It walks sixteen phases of the 0x1000 circle in 0x100 steps around the effect transform at 0x801EFA9C: each station is the phase truncated to a halfword and handed to the phase samplers 0x801783C8 and 0x801782FC, whose answers times the signed radius halfword at +0x10 shift right four on the transform y word and left four on its z word, and the same point with 0x100000 added to its x word gives the band far edge. Every step takes the shared primitive cursor anew, seeds it through the flat-quad setter 0x8017A9A4, turns semi-transparency on, projects the near and far edges of the current phase and then of the phase one 0x100 step further through 0x801AFF04 into one screen entry and copies the four pairs into the quad vertices, storing 0x80 in the red channel and clearing green and blue. It passes the first three vertex pairs to the shared cross-product test 0x801AFF90 and appends the 0x18-byte packet at ordering table index 1 only while that answer reads negative, so a step whose answer is zero or positive leaves the cursor untouched and its quad is dropped. It takes no arguments and returns nothing.'
