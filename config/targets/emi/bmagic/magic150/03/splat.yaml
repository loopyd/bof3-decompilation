    - publishEffectTransformFrom
    - '@source: src/bof3/bmagic/publishEffectTransformFrom.c'
    - '@behavior: Step handler 0 of this overlay, word 0 of the seven-word handler table at 0x801EEC04 (0x801EECA4, 0x801EED60, 0x801EEDCC, 0x801EEE24, 0x801EEEC4, 0x801EEF80, 0x801EF00C), which the dispatcher 0x801EEC20 copies into its 0x38-byte frame and indexes by unsigned work byte 1, so the table word is the only reference to this span in the payload. It reads the shared record through the pointer cell 0x801EC2E0 first, ahead of the frame adjustment, follows that record''s word 0x74 to the saved work-object pointer, and publishes that object''s words 0x34, 0x38 and 0x3C as the effect origin at 0x801EFA9C, 0x801EFAA0 and 0x801EFAA4, biasing the first by 0x14000 and the third by 0x2C00000. Each of the three stores re-reads the record word 0x74, so the walk is one pointer load per store. It then zeroes the ring radius 0x801EFAAC, the burst radius 0x801EFAAE and the fan angle 0x801EFAB0 as halfwords, calls the slot reset 0x801EF6B0 with no arguments so the eight effect slots at 0x801EFAB4 start idle, stores 0x3C into work byte 9 through the scratchpad cell 0x1F800044, re-reads that cell and increments work byte 1, which moves the dispatcher on to the next handler entry, and submits cue 0x100 through 0x8015DF18. Those are its only stores, it reads no other cell, it has no loop, and its 0x18-byte frame keeps $ra at $sp+0x10 across the two calls. It takes no arguments and returns nothing.'
  - - 352
