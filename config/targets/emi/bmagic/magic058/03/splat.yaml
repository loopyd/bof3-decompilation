    - '@behavior: Translucent Gouraud quad-ring emitter of this overlay step group, the narrower and coarser companion of the one at 0x801EF74C and called from the same place between the work-record transform func_801EF69C installs and its PopMatrix. It scales a tint halfword into the cell 0x1F800004 from the work object byte at 0x0A times six, then seeds two radius halfwords from the work object word at 0x0C: the outer cell 0x1F800000 takes that word plus 0x40 and the inner cell 0x1F800002 takes it unchanged, so the ring is 0x40 wide. It primes the outer edge 0x1F80001C and the inner edge 0x1F80002C from the shared rotator pair at 0x801782FC and 0x801783C8 at turn zero scaled by their own radius shifted right twelve, then picks the draw-mode tpage argument, 0xA5 when GetGraphType returns 1 or 2 and 0x35 otherwise, seeds SetDrawMode at g_PrimCursor with dfe 0, dtd 1 and a null RECT, and links a 0xC-byte packet at output slot 5. Each of the sixteen passes takes the cursor primitive, builds it through SetPolyG4, marks it semi-transparent, moves the primed outer edge into the first vertex and the primed inner edge into the third, rebuilds the second and fourth from four more rotator samples at the step shifted left eight, clears the four z halfwords, projects the quad through RotTransPers4 with the primitive vertex pairs at 0x08, 0x10, 0x18 and 0x20 as its screen outputs and two frame words as the depth and flag results, writes the low byte of the tint halfword into the two outer vertices and 1 into the two inner ones, and links one 0x24-byte POLY_G4 packet at the same output slot. Once the ring is closed it re-runs the draw-mode selection with a second pair of tpage values, 0x25 when GetGraphType returns 1 or 2 and 0x15 otherwise, re-seeds SetDrawMode at g_PrimCursor with the same dfe 0, dtd 1 and null RECT, and links one more 0xC-byte packet at output slot 5. Keeps $ra at 0x48 and all six saved registers in a 0x50-byte frame, takes no arguments and returns nothing.'
