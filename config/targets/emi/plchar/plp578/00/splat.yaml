    - '@source: src/bof3/plchar/claimFrontEndRecordHandler34FromPositionPairStoreStateDistanceAndClearRowByteBPlcharPlp57800_801CF444.c'
    - '@behavior: Claims one free front-end record and seeds it from a caller position pair. Asks the shared allocator func_8019601C for a row index, masks it to a byte and, unless that byte is 0xFF, scales it by the 0x74-byte row stride and seeds the row at 0x80143FC8: row byte 0 takes 1, row byte 5 takes handler selector 0x34, row byte 1 takes the caller state byte, row word 0x34 takes the first signed coordinate and row word 0x38 the second, each shifted left 16. It then re-reads row word 0x34 and passes it with the shifted second coordinate to the shared distance helper func_8015477C, storing that answer plus 0x100 in row halfword 0x3E, and clears row byte 0x0B. Nothing is returned and a full table leaves every row untouched. Three jal sites inside func_801CF24C reach it, at 0x801CF2BC, 0x801CF338 and 0x801CF374, and each ignores the result; no word of the payload holds this address.'
