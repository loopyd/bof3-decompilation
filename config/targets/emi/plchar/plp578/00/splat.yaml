    - '@behavior: Overlay step of the front-end work object read through the scratchpad pointer cell 0x1F800044. It takes the unsigned route index byte 0x08 and compares its distance from the candidate route indices 3 and 5: when the distance to 5 is the smaller one it asks the shared helper func_801B2D00 for the step sign towards 5 and stores that answer in byte 0x0B, otherwise it asks for the sign towards 3 and stores that. Both paths then store the chosen candidate index in byte 0x03, sharing one store, and the body sets the countdown byte 0x09 to 2 and increments the step counter byte 0x02, which re-arms the work object for the selected route. It takes no arguments and returns nothing. The pointer cell is re-read before every store because a store through the pointer may alias the cell itself; the first pointer load precedes frame creation and the 0x18-byte frame only keeps $ra at 0x10 across the calls. The only word of this payload that names this body is the pointer 0x801CF6A0 stored at 0x801CFAE8, entry 12 of the twenty-three-word handler run based at 0x801CFAB8, so it has no jal caller.'
