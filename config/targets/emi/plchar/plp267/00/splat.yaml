one unit further on the second axis, discarding that last answer. Every path then increments work byte 3 once more and the body closes by running the shared readiness helper func_8014DAEC. It takes no arguments and returns nothing. The 0x30-byte frame keeps $ra at 0x28 and the six saved registers $s5 to $s0 at 0x24 to 0x10 across the calls, the pointer cell is read before the frame is created, and the range constant 0 is materialised in the delay slot of the branch that leaves the answer test. A masked little-endian scan of the extracted payload corpus for this 0x24C-byte span finds six siblings, at the plp467, plp016, plp026, plp056, plp567 and plp678 spans, and each differs from this body in four words only: the three jal relocations of its own claim and the one internal jump word, every one of which shifts by exactly the delta between the two spans, while the remaining 143 words stay equal, so those copies are one shared body. No copy is byte-identical, so this span is seeded from the exact lift of the same body at 0x801CF8B4 of plp016. The roles of work byte 0x06, of the two seeded row bytes and of the answers beyond their effect are not established, so this block describes that effect only.'
