    - '@source: src/bof3/plchar/pickNearerRouteIndexStoreStepSignAndChosenRouteThenRearmWorkPlcharPlp01500_801CF170.c'
    - '@behavior: Re-arms the front-end work object read through the scratchpad pointer cell 0x1F800044 on the nearer of route indices 1 and 7. The body takes the unsigned route index byte 0x08, compares its distances from 1 and 7 and, when the distance to 7 is the smaller one, asks the shared route step-sign helper func_801B2D00 for the step sign towards 7 and stores that answer in byte 0x0B, otherwise it asks for the sign towards 1 and stores that; both paths store the chosen candidate index in byte 0x03. It then sets the countdown byte 0x09 to 2 and increments the step counter byte 0x02. It takes no arguments and returns nothing, the pointer cell is re-read before each store, and the 0x18-byte frame only keeps $ra at 0x10 across the two calls.'
