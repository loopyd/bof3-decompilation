    - '@behavior: Map cell claim of this front-end payload. The body narrows both arguments to the signed cell pair that the map probe and the record claim take and asks the shared map probe func_80166CB0 for the one-byte code of that cell. For the code 0xF2 it asks the shared allocator func_8019601C for a free front-end record and, unless that answer is 0xFF, claims one record with state 0 at the cell, rolls rand() and keeps the low four bits. A roll below 0xD stops there; from 0xD on the size starts at 5 and drops to 2 for the rolls 0xD and 0xE only. When flag bits 1 and 2 of 0x80143F02 are set, a second rand() masked to two bits expands that size to ten times its truncated byte on a zero answer. The body hands the size to func_801B5E58 and claims a second record with state 1 at the same cell. Every path that claimed a record then stores 1 into the work byte 0xB. For the code 0xF8 it claims one record with state 0 at the cell, copies the twelve-byte name that func_80165D48 answers for entry 0 of stream 0x56 into 0x801490D8, clears the terminator byte 0x801490E4, and takes the cue selector 2 when func_801650B4 reports entry 0 of stream 0x56 as set, after queueing cue 0x106 through func_8015DF18, and the selector 3 otherwise. It then dispatches that selector through func_80150284, marks the local state byte 0x80143BB0 busy with 2 and stores 1 into the work byte 0xB. Every claiming path ends by handing the original pair to func_801553B8 and answers 1, so the caller only retries a neighbouring cell when no record was claimed; any other cell code answers 0 without touching state.'
