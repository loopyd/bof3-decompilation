    - '@behavior: Overlay step of the front-end work object read through the scratchpad pointer cell 0x1F800044. It takes the unsigned route index byte 0x08, compares its distance from the candidate route indices 3 and 5, asks the shared helper func_801B2D00 for the step sign towards the nearer one and stores that answer in byte 0x0B. Both paths then store the chosen candidate index in byte 0x03 and the body sets countdown byte 0x09 to 2 and increments the step counter byte 0x02. It takes no arguments and returns nothing; the body is word 11 of the handler run at 0x801CFCB4 and runs as index 3 of the dispatch at 0x801CFCD4, so it is reached from outside the payload.'
