# The reviewed switch at 0x801F3F34 dispatches the shared mode byte 0x801448EC
# through a 48-entry table that the original placed in this payload's leading
# table data at 0x801F2C04 (0xC0 bytes). psyq gcc emits the jump table after
# .rdata + .align 3, so the section carries 8-byte alignment while that address
# is 4-mod-8; the placement route lowers only the affected section's alignment
# to the reviewed address's own alignment so the table lands exactly and the
# emitted lui/lw relocation matches.
[[matching.section_placements]]
function = 0x801F3F34
section = ".rodata"
address = 0x801F2C04
size = 0xC0
