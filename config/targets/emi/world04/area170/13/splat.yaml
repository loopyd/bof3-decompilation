    - '@source: src/bof3/world/advanceWorkByte2WhenCameraOutsideRecordCoordinateWindowWorld04Area17013_801F3F84.c'
    - '@behavior: Overlay step gate over the scratchpad work record at 0x1F800044. Reads the record route byte at +8 once: when it is non-zero the gate compares the shared camera word D_80145EC8 with the record halfword at +0x3A, and when it is zero it compares D_80145EC4 with the record halfword at +0x36 instead. Both comparisons build the cell centre ((halfword + 1) << 16) | 0x8000, take the absolute difference from the camera word and advance the record step byte at +2 when that difference exceeds 0x20000. When the first check passes, the record halfword of the other axis and the matching camera word become the shared tail operands: the step byte is advanced when the absolute difference from both the halfword cell start and the next cell start exceeds 0x20000. Takes no arguments, returns nothing and keeps no frame.'
