[package]
name = "bof3-text-v1"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "BOF3 area dialogue text block index, extract, validate, query and repack tool"

[[bin]]
name = "bof3-text"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Language-aware scan scoring (user-authorized): Unicode Script property plus a
# language guess reported with its own confidence and reliability flag.
unicode-script = "0.5.8"
whatlang = "0.18.0"
