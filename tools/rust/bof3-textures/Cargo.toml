[package]
name = "bof3-textures"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "BOF3 graphics catalog, interchange, and verification"

[dependencies]
emi-ex-v2 = { path = "../emi-ex" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
