[package]
name = "bof3-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "BOF3 audio preservation, interchange, and runtime tools"

[dependencies]
emi-ex-v2 = { path = "../emi-ex" }
oxideav-mp3 = "=0.1.3"
oxideav-vorbis = "=0.0.12"
roxmltree = "=0.21.1"
rustysynth = "=1.3.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
strip = true
lto = true
codegen-units = 1
