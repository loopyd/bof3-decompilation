[package]
name = "bof3-disk-v2"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "bof3-disk"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
hound = "3.5.1"
md-5 = "0.11.0"
quick-xml = "0.41.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
