[package]
name = "emi-ex-v2"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "emi-ex"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
