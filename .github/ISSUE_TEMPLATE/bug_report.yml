name: Bug report
description: Report a reproducible problem with repository code or documentation.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach original game assets, extracted binaries, or copyrighted source.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, target/address, and any relevant inputs.
      placeholder: |
        bin/...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error output, byte-match result, or a concise log excerpt.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or branch tested.
