[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bof3-harness"
version = "0.1.0"
description = "Local BOF3 PSX reverse-engineering tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
]
third_party = [
    "colorama>=0.4.6",
    "cxxfilt>=0.3.0",
    "levenshtein>=0.27.0",
    "toml>=0.10.2",
    "watchdog>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "tools/python"}

[tool.setuptools.packages.find]
where = ["tools/python"]

[tool.pytest.ini_options]
pythonpath = [
    "tools/python",
    "tools/python/tests",
    "tools/python/tests/analysis",
    "tools/python/tests/application",
    "tools/python/tests/build",
    "tools/python/tests/commands",
    "tools/python/tests/decomp",
    "tools/python/tests/domain",
    "tools/python/tests/emi",
    "tools/python/tests/macros",
    "tools/python/tests/naming",
    "tools/python/tests/perf",
    "tools/python/tests/skills",
    "tools/python/tests/toolchain",
    "tools/python/tests/types",
]
testpaths = ["tools/python/tests"]
# pytest's default norecursedirs excludes a directory named "build"; the
# per-module unit folder of that name must still be collected.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
