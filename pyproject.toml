[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rebof3-simple"
version = "0.1.0"
description = "Minimal BOF3 inventory and Ghidra planning pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[project.scripts]
bof3 = "rebof3.cli:main"

[tool.setuptools]
package-dir = {"" = "tools/python"}

[tool.setuptools.packages.find]
where = ["tools/python"]

[tool.pytest.ini_options]
pythonpath = ["tools/python"]
testpaths = ["tools/python/tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
